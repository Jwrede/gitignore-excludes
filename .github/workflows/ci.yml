name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install restic and borg
        run: |
          curl -fsSL https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2 | bunzip2 > restic
          sudo install -m755 restic /usr/local/bin/restic
          sudo curl -fsSL -o /usr/local/bin/borg https://github.com/borgbackup/borg/releases/download/1.4.5/borg-linux-glibc235-x86_64-gh
          sudo chmod +x /usr/local/bin/borg
          restic version
          borg --version
      - run: pip install -e ".[dev]"
      - run: pytest -v -rs
      - run: ruff check .
      - run: ruff format --check .
      - run: gitignore-excludes --version
